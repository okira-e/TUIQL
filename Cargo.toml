[package]
name = "tuiql"
version = "0.1.0"
description = "SQL database client in your terminal."
authors = ["Omar <omarrafat60@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
async-trait = "0.1.88"
clap = { version = "4.5.37", features = ["derive"] }
color-eyre = "0.6.3"
colored = "3.0.0"
crossterm = { version = "0.28.1", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.31"
ratatui = "0.29.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.5", features = ["runtime-tokio", "postgres", "mysql", "sqlite", "macros", "any"] }
tabled = "0.19.0"
tokio = { version = "1.40.0", features = ["full"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
url = "2.5.4"
